services:
  deskpilot-server:
    build:
      context: .
      dockerfile: DeskPilot.Server/Dockerfile
    container_name: deskpilot-server
    restart: always
    ports:
      - "5000:5000"
    # Các giá trị bí mật (chuỗi kết nối, API key) được khai báo trong file .env (không commit). Xem .env.example
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Bật để Server tự áp dụng migration khi khởi động (tắt nếu chạy migration thủ công)
      - Database__MigrateOnStartup=${DESKPILOT_MIGRATE_ON_STARTUP:-true}